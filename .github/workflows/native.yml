# Builds the native libraries SimpleHPSDR names itself (miniaudio, RADE, ASIO)
# and WDSP for Linux and Windows. macOS ones are built on a Mac (see NATIVE-BUILD.md).
# codec2 and FFTW don't change here and keep their committed binaries.
# The artifacts are copied into SimpleHPSDR.Dsp/runtimes/<rid>/native by hand.
name: Native libraries

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/miniaudio/**'
      - 'native/radae/**'
      - 'native/asio/**'
      - 'native/wdsp/**'
      - 'native/rnnoise/**'
      - 'native/libspecbleach/**'
      - '.github/workflows/native.yml'

jobs:
  # WDSP links the committed FFTW (libfftw3.so.3 / libfftw3f.so.3, FFTW 3.3.10,
  # the same as bookworm's) and finds it beside itself through $ORIGIN.
  wdsp-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian bookworm
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq build-essential cmake ninja-build pkg-config libfftw3-dev patchelf >/dev/null
            cmake -S native/wdsp -B /tmp/wdsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DWDSP_WITH_NR3=ON -DWDSP_WITH_NR4=ON
            cmake --build /tmp/wdsp --parallel
            mkdir -p out
            cp /tmp/wdsp/libwdsp.so out/
            strip --strip-unneeded out/libwdsp.so
            patchelf --set-rpath "\$ORIGIN" out/libwdsp.so
            chown -R '"$(id -u):$(id -g)"' out
          '
      - name: Check exports and links
        run: |
          set -eo pipefail
          syms=$(nm -D --defined-only out/libwdsp.so)
          for sym in GetWDSPVersion PSSaveCorr PSRestoreCorr SetPSControl; do
            if ! grep -E " $sym\$" <<<"$syms"; then
              echo "missing export: $sym"
              exit 1
            fi
          done
          objdump -p out/libwdsp.so | grep -E "NEEDED|RUNPATH"
          unexpected=$(objdump -p out/libwdsp.so | grep NEEDED | grep -v -E "libfftw3f?\.so\.3|libc\.so|libm\.so|ld-linux|libpthread" || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected NEEDED entries:"
            echo "$unexpected"
            exit 1
          fi
          objdump -T out/libwdsp.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
          sha256sum out/libwdsp.so
      - uses: actions/upload-artifact@v4
        with:
          name: wdsp-${{ matrix.rid }}
          path: out/libwdsp.so

  # Visual Studio with ClangCL and vcpkg FFTW linked in statically (NATIVE-BUILD.md):
  # static-md triplet on x64, static CRT on arm64 (cross-built on the x64 runner).
  wdsp-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, arch: x64, triplet: x64-windows-static-md, crt: MultiThreadedDLL }
          - { rid: win-arm64, arch: ARM64, triplet: arm64-windows-static, crt: MultiThreaded }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "fftw3:${{ matrix.triplet }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S native/wdsp -B build -A ${{ matrix.arch }} -T ClangCL `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.crt }} -DWDSP_WITH_NR3=ON -DWDSP_WITH_NR4=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/wdsp.dll out/
          Get-FileHash out/wdsp.dll -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: wdsp-${{ matrix.rid }}
          path: out/wdsp.dll

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Debian bookworm (glibc 2.36): the oldest system SimpleHPSDR supports,
      # including the G2's own Raspberry Pi.
      - name: Build in Debian bookworm
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq build-essential cmake ninja-build pkg-config >/dev/null
            cmake -S native/miniaudio -B /tmp/ma -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/ma --parallel
            cp -R native/radae /tmp/radae
            cd /tmp/radae/vendor/opus_dnn
            for t in $(grep -ohE "(silk|celt|dnn|src)/[A-Za-z0-9_/.-]+\.[ch]\b" *.mk | sort -u); do
              [ -e "$t" ] || { mkdir -p "$(dirname "$t")"; : > "$t"; }
            done
            cd /w
            cmake -S /tmp/radae -B /tmp/rade -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DOPUS_DISABLE_INTRINSICS=ON -DSIMPLEHPSDR_RADE_VENDOR=/tmp/radae/vendor \
              -DSIMPLEHPSDR_RADE_BUILD_TEST=OFF
            cmake --build /tmp/rade --parallel
            mkdir -p out
            cp /tmp/ma/libminiaudio.so out/
            cp "$(readlink -f /tmp/rade/libsimplehpsdr_rade.so)" out/libsimplehpsdr_rade.so
            strip --strip-unneeded out/*.so
            chown -R '"$(id -u):$(id -g)"' out
          '
      - name: Check exports
        run: |
          nm -D --defined-only out/libminiaudio.so | grep -c " simplehpsdr_ma_"
          nm -D --defined-only out/libsimplehpsdr_rade.so | grep -c " simplehpsdr_rade_"
          if nm -D out/*.so | grep -i zeus; then echo "unexpected zeus symbol"; exit 1; fi
          objdump -T out/*.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/*.so

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: miniaudio and ASIO (Visual Studio)
        shell: pwsh
        run: |
          cmake -S native/miniaudio -B build-ma -A x64
          cmake --build build-ma --config Release --parallel
          cmake -S native/asio -B build-asio -A x64
          cmake --build build-asio --config Release --parallel
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build-ma/Release/miniaudio.dll out/
          Copy-Item build-asio/Release/simplehpsdr_asio.dll out/
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: RADE (MSYS2 UCRT64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cp -R native/radae /tmp/radae
          cd /tmp/radae/vendor/opus_dnn
          for t in $(grep -ohE "(silk|celt|dnn|src)/[A-Za-z0-9_/.-]+\.[ch]\b" *.mk | sort -u); do
            [ -e "$t" ] || { mkdir -p "$(dirname "$t")"; : > "$t"; }
          done
          cd -
          cmake -S /tmp/radae -B /tmp/rade -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPUS_DISABLE_INTRINSICS=ON -DSIMPLEHPSDR_RADE_VENDOR=/tmp/radae/vendor \
            -DSIMPLEHPSDR_RADE_BUILD_TEST=OFF
          cmake --build /tmp/rade --parallel
          cp /tmp/rade/simplehpsdr_rade.dll out/
          objdump -p out/simplehpsdr_rade.dll | grep "DLL Name"
          objdump -p out/simplehpsdr_rade.dll | grep -c "simplehpsdr_rade_"
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: out/*.dll
